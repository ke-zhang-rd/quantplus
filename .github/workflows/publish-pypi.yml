# This workflow will upload a Python Package using flit when a release is
# created.  For more information see:
# https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Pypi Upload

on:
  release:
    types: [created]

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Dependencies C++
        run: |
          sudo apt-get update
          sudo apt-get install git build-essential cmake libeigen3-dev valgrind
          sudo ln -s /usr/include/eigen3/Eigen /usr/include/Eigen
          ls /usr/include          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools twine wheel numpy cython

      - name: Build and publish
        env:
          TWINE_USERNAME: __token__
          # The PYPI_PASSWORD must be a pypi token with the "pypi-" prefix with sufficient permissions to upload this package
          # https://pypi.org/help/#apitoken
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python setup.py sdist bdist_wheel
          twine upload dist/*
